<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManisDonat - E-Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Konfigurasi warna Tailwind khusus */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              pastel: '#FDF8F5',
              pink: '#FAD4D4',
              brown: '#8B5A2B',
              lightbrown: '#C19A6B'
            }
          }
        }
      }
    }
    /* Sembunyikan elemen lain saat mencetak struk */
    @media print {
      body * { visibility: hidden; }
      #receipt-content, #receipt-content * { visibility: visible; }
      #receipt-content { position: absolute; left: 0; top: 0; width: 100%; padding: 0; box-shadow: none; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-brand-pastel text-gray-800 font-sans min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <h1 class="text-2xl font-bold text-brand-brown cursor-pointer" onclick="switchView('home')">🍩 ManisDonat</h1>
        <button onclick="switchView('admin')" class="text-sm font-medium text-gray-500 hover:text-brand-brown">Admin Panel</button>
      </div>
      <button onclick="toggleCart()" class="relative p-2 bg-brand-pink text-brand-brown rounded-full hover:bg-pink-200 transition">
        🛒 <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
      </button>
    </div>
  </nav>

  <!-- Container Utama -->
  <main class="max-w-6xl mx-auto px-4 py-8" id="main-content">
    
    <!-- HALAMAN BERANDA (CATALOG) -->
    <div id="view-home">
      <!-- Tabs Kategori -->
      <div class="flex justify-center gap-4 mb-8">
        <button onclick="setCategory('Bomboloni')" id="tab-Bomboloni" class="px-6 py-2 rounded-full font-bold transition border-2 border-brand-brown bg-brand-brown text-white">Bomboloni</button>
        <button onclick="setCategory('Donat')" id="tab-Donat" class="px-6 py-2 rounded-full font-bold transition border-2 border-brand-brown text-brand-brown bg-transparent hover:bg-brand-pink">Donat</button>
      </div>
      <!-- Grid Produk -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Produk akan dirender di sini oleh JS -->
      </div>
    </div>

    <!-- HALAMAN ADMIN -->
    <div id="view-admin" class="hidden">
      <h2 class="text-3xl font-bold text-brand-brown mb-6">Manajemen Menu</h2>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-brand-pink mb-8">
        <h3 class="text-xl font-bold mb-4" id="admin-form-title">Tambah Menu Baru</h3>
        <form id="admin-form" onsubmit="handleSaveProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="hidden" id="admin-id">
          <div>
            <label class="block text-sm font-bold text-brand-brown mb-1">Nama Produk</label>
            <input type="text" id="admin-name" required class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown">
          </div>
          <div>
            <label class="block text-sm font-bold text-brand-brown mb-1">Kategori</label>
            <select id="admin-category" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown">
              <option value="Bomboloni">Bomboloni</option>
              <option value="Donat">Donat</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-brand-brown mb-1">Harga (Rp)</label>
            <input type="number" id="admin-price" required class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown">
          </div>
          <div>
            <label class="block text-sm font-bold text-brand-brown mb-1">URL Gambar</label>
            <input type="text" id="admin-image" required class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown" placeholder="https://...">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-bold text-brand-brown mb-1">Deskripsi Singkat</label>
            <input type="text" id="admin-desc" required class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown">
          </div>
          <div class="md:col-span-2 flex gap-2">
            <button type="submit" class="bg-brand-brown text-white px-6 py-2 rounded-lg font-bold hover:bg-amber-900">Simpan Produk</button>
            <button type="button" onclick="resetAdminForm()" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-300">Batal</button>
          </div>
        </form>
      </div>

      <!-- Tabel Admin -->
      <div class="bg-white rounded-2xl shadow-sm border border-brand-pink overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-brand-pink text-brand-brown">
              <th class="p-3">Gambar</th>
              <th class="p-3">Nama Menu</th>
              <th class="p-3">Kategori</th>
              <th class="p-3">Harga</th>
              <th class="p-3">Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-table-body" class="divide-y divide-brand-pink/50">
            <!-- Data tabel admin dirender di sini -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL KERANJANG -->
  <div id="cart-overlay" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity" onclick="if(event.target === this) toggleCart()">
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl flex flex-col transform transition-transform" id="cart-panel">
      <div class="p-4 bg-brand-pink flex justify-between items-center text-brand-brown">
        <h2 class="text-xl font-bold">Keranjang Belanja</h2>
        <button onclick="toggleCart()" class="text-2xl font-bold hover:text-red-500">&times;</button>
      </div>
      
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
        <!-- Item keranjang dirender di sini -->
      </div>
      
      <div class="p-4 border-t border-brand-pink bg-brand-pastel">
        <div class="flex justify-between items-center mb-4 text-lg font-bold text-brand-brown">
          <span>Total:</span>
          <span id="cart-total-price">Rp 0</span>
        </div>
        <button onclick="openCheckout()" class="w-full bg-brand-brown text-white py-3 rounded-xl font-bold text-lg hover:bg-amber-900 transition">Checkout Sekarang</button>
      </div>
    </div>
  </div>

  <!-- MODAL CHECKOUT -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/60 z-[60] hidden flex justify-center items-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 bg-brand-brown text-white flex justify-between items-center">
        <h2 class="text-xl font-bold">Informasi Pengiriman</h2>
        <button onclick="closeCheckout()" class="text-2xl font-bold hover:text-brand-pink">&times;</button>
      </div>
      <div class="p-6 overflow-y-auto">
        <form id="checkout-form" onsubmit="processCheckout(event)" class="flex flex-col gap-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Nama Lengkap</label>
            <input type="text" id="cust-name" required class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Nomor WhatsApp</label>
            <input type="text" id="cust-wa" required placeholder="0812..." class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Alamat Pengiriman</label>
            <textarea id="cust-address" required rows="3" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown"></textarea>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Metode Pembayaran</label>
            <select id="cust-payment" class="w-full border border-gray-300 p-2 rounded-lg focus:outline-none focus:border-brand-brown">
              <option value="Transfer Bank">Transfer Bank</option>
              <option value="E-Wallet (OVO/GoPay)">E-Wallet (OVO/GoPay)</option>
              <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
            </select>
          </div>
          <button type="submit" class="mt-2 w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-700 transition">Pesan Sekarang</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL STRUK (RECEIPT) -->
  <div id="receipt-modal" class="fixed inset-0 bg-black/60 z-[70] hidden flex justify-center items-center p-4">
    <div class="bg-white rounded-sm shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[95vh]">
      <div id="receipt-content" class="p-6 bg-white text-gray-800">
        <div class="text-center mb-4 border-b-2 border-dashed border-gray-300 pb-4">
          <h2 class="text-2xl font-bold text-brand-brown mb-1">🍩 ManisDonat</h2>
          <p class="text-sm text-gray-500">Jl. Manis Selalu No. 123, Jakarta</p>
          <p class="text-sm text-gray-500" id="receipt-date"></p>
        </div>
        
        <div class="mb-4 text-sm">
          <p><span class="font-bold">Pembeli:</span> <span id="r-name"></span></p>
          <p><span class="font-bold">WhatsApp:</span> <span id="r-wa"></span></p>
          <p><span class="font-bold">Pembayaran:</span> <span id="r-payment"></span></p>
          <p><span class="font-bold">Alamat:</span> <span id="r-address"></span></p>
        </div>

        <div class="border-t border-b border-gray-200 py-3 mb-4">
          <table class="w-full text-sm text-left">
            <thead>
              <tr class="text-gray-500"><th class="pb-2">Item</th><th class="pb-2 text-center">Qty</th><th class="pb-2 text-right">Subtotal</th></tr>
            </thead>
            <tbody id="receipt-items"></tbody>
          </table>
        </div>
        
        <div class="flex justify-between items-center text-lg font-bold text-brand-brown">
          <span>TOTAL</span>
          <span id="r-total"></span>
        </div>
        <p class="text-center text-xs text-gray-400 mt-6 italic">Terima kasih telah berbelanja di ManisDonat!</p>
      </div>
      
      <!-- Tombol Aksi Struk -->
      <div class="p-4 bg-gray-100 flex flex-col gap-2 no-print border-t">
        <button onclick="window.print()" class="w-full bg-gray-600 text-white py-2 rounded-lg font-bold hover:bg-gray-700 flex justify-center items-center gap-2">🖨️ Cetak / Simpan PDF</button>
        <button onclick="sendToWhatsApp()" class="w-full bg-green-500 text-white py-2 rounded-lg font-bold hover:bg-green-600 flex justify-center items-center gap-2">💬 Kirim Pesanan via WhatsApp</button>
        <button onclick="finishOrder()" class="w-full bg-brand-brown text-white py-2 rounded-lg font-bold hover:bg-amber-900 mt-2">Selesai & Tutup</button>
      </div>
    </div>
  </div>

  <script>
    // --- DATA DEFAULT ---
    const defaultData = [
      { id: 1, name: 'Redvelvet Cream Cheese', category: 'Bomboloni', price: 18000, image: 'https://images.unsplash.com/photo-1551024506-0baa8740812d?auto=format&fit=crop&w=400&q=80', desc: 'Isian cream cheese tebal lumer' },
      { id: 2, name: 'Double Choco', category: 'Bomboloni', price: 15000, image: 'https://images.unsplash.com/photo-1626244498363-d3090632b7e6?auto=format&fit=crop&w=400&q=80', desc: 'Coklat luar dalam super nyoklat' },
      { id: 3, name: 'Cookies & Cream', category: 'Bomboloni', price: 17000, image: 'https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?auto=format&fit=crop&w=400&q=80', desc: 'Isian krim vanilla dengan biskuit Oreo' },
      { id: 4, name: 'Matcha', category: 'Bomboloni', price: 16000, image: 'https://images.unsplash.com/photo-1601000632517-578ce8ff6ea7?auto=format&fit=crop&w=400&q=80', desc: 'Krim matcha Jepang asli' },
      { id: 5, name: 'Strawberry', category: 'Bomboloni', price: 15000, image: 'https://images.unsplash.com/photo-1612240498936-65f5101365d2?auto=format&fit=crop&w=400&q=80', desc: 'Selai stroberi segar manis asam' },
      { id: 6, name: 'Tiramisu', category: 'Bomboloni', price: 17000, image: 'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=400&q=80', desc: 'Rasa kopi dan mascarpone klasik' },
      { id: 7, name: 'Donat Vanilla', category: 'Donat', price: 10000, image: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=400&q=80', desc: 'Glaze vanilla klasik' },
      { id: 8, name: 'Donat Coklat', category: 'Donat', price: 12000, image: 'https://images.unsplash.com/photo-1527515862127-a4fc05baf7a5?auto=format&fit=crop&w=400&q=80', desc: 'Coklat lumer dengan taburan ceres' },
      { id: 9, name: 'Donat Tiramisu', category: 'Donat', price: 13000, image: 'https://images.unsplash.com/photo-1632516766446-c9fb25ef3b17?auto=format&fit=crop&w=400&q=80', desc: 'Topping tiramisu lembut' },
      { id: 10, name: 'Donat Matcha', category: 'Donat', price: 13000, image: 'https://images.unsplash.com/photo-1558485292-8094760fc5f2?auto=format&fit=crop&w=400&q=80', desc: 'Topping glaze matcha asli' }
    ];

    // --- STATE ---
    let products = JSON.parse(localStorage.getItem('manisdonat_products')) || defaultData;
    let cart = [];
    let currentCategory = 'Bomboloni';
    let checkoutData = {};

    // --- UTILS ---
    const formatRp = (angka) => 'Rp ' + angka.toLocaleString('id-ID');

    // --- INISIALISASI ---
    function init() {
      renderProducts();
      renderAdminTable();
    }

    // --- NAVIGASI TAMPILAN ---
    function switchView(view) {
      document.getElementById('view-home').classList.toggle('hidden', view !== 'home');
      document.getElementById('view-admin').classList.toggle('hidden', view !== 'admin');
    }

    // --- LOGIKA KATALOG (BERANDA) ---
    function setCategory(cat) {
      currentCategory = cat;
      // Update style Tab
      ['Bomboloni', 'Donat'].forEach(c => {
        const btn = document.getElementById(`tab-${c}`);
        if (c === cat) {
          btn.classList.add('bg-brand-brown', 'text-white');
          btn.classList.remove('bg-transparent', 'text-brand-brown');
        } else {
          btn.classList.remove('bg-brand-brown', 'text-white');
          btn.classList.add('bg-transparent', 'text-brand-brown');
        }
      });
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      const filtered = products.filter(p => p.category === currentCategory);
      
      if(filtered.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">Belum ada menu di kategori ini.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-brand-pink hover:shadow-md transition group flex flex-col h-full">
          <div class="h-48 overflow-hidden bg-brand-pink relative">
            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <span class="absolute top-2 right-2 bg-white/90 text-brand-brown px-3 py-1 rounded-full text-sm font-bold shadow-sm">${p.category}</span>
          </div>
          <div class="p-5 flex flex-col flex-1">
            <h3 class="font-bold text-lg text-brand-brown mb-1">${p.name}</h3>
            <p class="text-sm text-gray-500 line-clamp-2 mb-3 flex-1">${p.desc}</p>
            <div class="flex justify-between items-center mt-auto">
              <span class="font-bold text-brand-lightbrown text-lg">${formatRp(p.price)}</span>
              <button onclick="addToCart(${p.id})" class="bg-brand-brown text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-amber-900 transition shadow-sm font-bold text-xl">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // --- LOGIKA KERANJANG ---
    function toggleCart() {
      const overlay = document.getElementById('cart-overlay');
      overlay.classList.toggle('hidden');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartQty(id, change) {
      const itemIndex = cart.findIndex(item => item.id === id);
      if (itemIndex > -1) {
        cart[itemIndex].qty += change;
        if (cart[itemIndex].qty <= 0) {
          cart.splice(itemIndex, 1);
        }
      }
      updateCartUI();
    }

    function updateCartUI() {
      // Update badge
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-badge').innerText = totalItems;
      
      // Update list keranjang
      const cartContainer = document.getElementById('cart-items');
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-total-price').innerText = formatRp(totalPrice);

      if (cart.length === 0) {
        cartContainer.innerHTML = `<div class="text-center text-gray-400 py-10">Keranjang masih kosong<br><span class="text-4xl mt-2 block">🍩</span></div>`;
        return;
      }

      cartContainer.innerHTML = cart.map(item => `
        <div class="flex gap-3 bg-white p-3 rounded-xl border border-gray-100 shadow-sm items-center">
          <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
          <div class="flex-1">
            <h4 class="font-bold text-sm text-brand-brown">${item.name}</h4>
            <p class="text-brand-lightbrown text-sm font-semibold">${formatRp(item.price)}</p>
          </div>
          <div class="flex items-center gap-2 bg-brand-pastel rounded-lg p-1">
            <button onclick="updateCartQty(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded text-brand-brown font-bold shadow-sm">-</button>
            <span class="w-4 text-center text-sm font-bold">${item.qty}</span>
            <button onclick="updateCartQty(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center bg-brand-brown rounded text-white font-bold shadow-sm">+</button>
          </div>
        </div>
      `).join('');
    }

    // --- LOGIKA CHECKOUT ---
    function openCheckout() {
      if (cart.length === 0) {
        alert("Keranjang masih kosong!");
        return;
      }
      document.getElementById('cart-overlay').classList.add('hidden');
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckout() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function processCheckout(e) {
      e.preventDefault();
      
      // Ambil data form
      checkoutData = {
        name: document.getElementById('cust-name').value,
        wa: document.getElementById('cust-wa').value,
        address: document.getElementById('cust-address').value,
        payment: document.getElementById('cust-payment').value,
        date: new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' }),
        total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0)
      };

      generateReceipt();
      
      // Tutup checkout, buka struk
      closeCheckout();
      document.getElementById('receipt-modal').classList.remove('hidden');
    }

    // --- LOGIKA STRUK ---
    function generateReceipt() {
      document.getElementById('receipt-date').innerText = checkoutData.date;
      document.getElementById('r-name').innerText = checkoutData.name;
      document.getElementById('r-wa').innerText = checkoutData.wa;
      document.getElementById('r-payment').innerText = checkoutData.payment;
      document.getElementById('r-address').innerText = checkoutData.address;
      document.getElementById('r-total').innerText = formatRp(checkoutData.total);

      document.getElementById('receipt-items').innerHTML = cart.map(item => `
        <tr>
          <td class="py-1">${item.name}</td>
          <td class="py-1 text-center">${item.qty}x</td>
          <td class="py-1 text-right">${formatRp(item.price * item.qty)}</td>
        </tr>
      `).join('');
    }

    function sendToWhatsApp() {
      const phone = "6281234567890"; // Ganti dengan nomor WA Admin/Toko
      let message = `*HALO MANISDONAT, SAYA MAU PESAN!* 🍩\n\n`;
      message += `*Nama:* ${checkoutData.name}\n`;
      message += `*No WA:* ${checkoutData.wa}\n`;
      message += `*Alamat:* ${checkoutData.address}\n`;
      message += `*Pembayaran:* ${checkoutData.payment}\n\n`;
      message += `*PESANAN:*\n`;
      cart.forEach(item => {
        message += `- ${item.name} (${item.qty}x) = ${formatRp(item.price * item.qty)}\n`;
      });
      message += `\n*TOTAL: ${formatRp(checkoutData.total)}*\n\nTerima kasih!`;

      const waURL = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(waURL, '_blank');
    }

    function finishOrder() {
      cart = [];
      updateCartUI();
      document.getElementById('checkout-form').reset();
      document.getElementById('receipt-modal').classList.add('hidden');
      alert("Pesanan selesai! Terima kasih.");
    }

    // --- LOGIKA ADMIN (CRUD) ---
    function saveToLocal() {
      localStorage.setItem('manisdonat_products', JSON.stringify(products));
      renderProducts();
      renderAdminTable();
    }

    function renderAdminTable() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = products.map(p => `
        <tr class="hover:bg-brand-pastel">
          <td class="p-3"><img src="${p.image}" class="w-12 h-12 object-cover rounded-md border border-gray-200"></td>
          <td class="p-3 font-medium">${p.name}</td>
          <td class="p-3"><span class="bg-brand-pink text-brand-brown text-xs px-2 py-1 rounded-full">${p.category}</span></td>
          <td class="p-3">${formatRp(p.price)}</td>
          <td class="p-3">
            <button onclick="editProduct(${p.id})" class="text-blue-500 hover:text-blue-700 font-medium mr-3">Edit</button>
            <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700 font-medium">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    function handleSaveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('admin-id').value;
      
      const newProduct = {
        id: id ? parseInt(id) : Date.now(),
        name: document.getElementById('admin-name').value,
        category: document.getElementById('admin-category').value,
        price: parseInt(document.getElementById('admin-price').value),
        image: document.getElementById('admin-image').value,
        desc: document.getElementById('admin-desc').value
      };

      if (id) {
        // Mode Edit
        const index = products.findIndex(p => p.id === parseInt(id));
        products[index] = newProduct;
      } else {
        // Mode Tambah
        products.push(newProduct);
      }

      saveToLocal();
      resetAdminForm();
      alert(id ? "Menu berhasil diupdate!" : "Menu baru berhasil ditambahkan!");
    }

    function editProduct(id) {
      const product = products.find(p => p.id === id);
      if(!product) return;

      document.getElementById('admin-form-title').innerText = "Edit Menu";
      document.getElementById('admin-id').value = product.id;
      document.getElementById('admin-name').value = product.name;
      document.getElementById('admin-category').value = product.category;
      document.getElementById('admin-price').value = product.price;
      document.getElementById('admin-image').value = product.image;
      document.getElementById('admin-desc').value = product.desc;
      window.scrollTo(0, 0);
    }

    function deleteProduct(id) {
      if(confirm("Apakah Anda yakin ingin menghapus menu ini?")) {
        products = products.filter(p => p.id !== id);
        
        // Hapus juga dari keranjang jika ada
        cart = cart.filter(item => item.id !== id);
        updateCartUI();
        
        saveToLocal();
      }
    }

    function resetAdminForm() {
      document.getElementById('admin-form-title').innerText = "Tambah Menu Baru";
      document.getElementById('admin-form').reset();
      document.getElementById('admin-id').value = "";
    }

    // Jalankan saat pertama load
    init();
  </script>
</body>
</html>
